<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ La Liga Live Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #070f26; color: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
        @keyframes pulse-cyan {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .live-dot { animation: pulse-cyan 1.5s infinite; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-blue-900/60 pb-5 gap-4">
            <div>
                <h1 class="text-3xl font-black text-cyan-400 tracking-wide flex items-center gap-2 drop-shadow-sm">
                    🇪🇸 LA LIGA DASHBOARD
                </h1>
                <p class="text-slate-400 text-sm mt-1">Saison 2026/27 • Live-Ergebnisse & Standings via ESPN</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div id="live-indicator" class="hidden items-center gap-2 bg-cyan-950/80 border border-cyan-500/50 text-cyan-300 px-3 py-1.5 rounded-lg text-xs font-bold">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 live-dot"></span>
                    LIVE TICKER AKTIV
                </div>
                
                <!-- Spieltag Filter -->
                <div class="flex items-center gap-2 bg-blue-950/90 border border-blue-800/80 px-3 py-1.5 rounded-xl shadow-inner">
                    <span class="text-xs text-blue-300 font-semibold">📅 Spieltag:</span>
                    <select id="matchweek-select" onchange="loadSelectedMatchweek()" class="bg-transparent text-cyan-400 font-bold text-sm focus:outline-none">
                        <!-- Dynamisch gefüllt -->
                    </select>
                </div>

                <button onclick="refreshAllData()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl shadow-lg transition flex items-center gap-2 border border-blue-400/30">
                    🔄 Aktualisieren
                </button>
            </div>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="flex border-b border-blue-900/60 space-x-2">
            <button id="tab-btn-games" onclick="switchTab('games')" class="px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-900/80 text-cyan-300 border-t-2 border-cyan-400 transition shadow-lg">
                ⚽ Kompletter Spieltag (10 Spiele)
            </button>
            <button id="tab-btn-standings" onclick="switchTab('standings')" class="px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-950/40 text-slate-400 hover:text-white transition">
                📊 La Liga Tabelle
            </button>
        </div>

        <!-- TAB 1: SPIELE & LIVE SCORES -->
        <div id="tab-content-games" class="space-y-6">
            <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-12 text-slate-400 animate-pulse">
                    ⌛ Lade La Liga Spieltag...
                </div>
            </div>
        </div>

        <!-- TAB 2: TABELLE -->
        <div id="tab-content-standings" class="hidden space-y-8">
            <div class="bg-blue-950/40 p-6 rounded-2xl border border-blue-900/60 shadow-xl space-y-4 backdrop-blur-sm">
                <div class="flex justify-between items-center border-b border-blue-900/60 pb-3">
                    <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">🏆 La Liga Standings 2026/27</h2>
                    <div class="flex items-center gap-4 text-xs font-semibold">
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span> UEFA Champions League</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Europa League</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Abstieg</span>
                    </div>
                </div>

                <div class="overflow-x-auto custom-scroll">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-blue-950 text-blue-300 uppercase text-xs">
                            <tr>
                                <th class="px-3 py-3 min-w-[40px]">#</th>
                                <th class="px-4 py-3 min-w-[200px]">Club</th>
                                <th class="px-3 py-3 text-center">Sp</th>
                                <th class="px-3 py-3 text-center">S</th>
                                <th class="px-3 py-3 text-center">U</th>
                                <th class="px-3 py-3 text-center">N</th>
                                <th class="px-3 py-3 text-center">Tore</th>
                                <th class="px-3 py-3 text-center">Diff</th>
                                <th class="px-4 py-3 text-center font-bold text-cyan-300">Pkt</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-blue-900/40">
                            <tr><td colspan="9" class="px-4 py-6 text-center text-slate-500">Lade Tabelle...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

        function initMatchweekSelect() {
            const select = document.getElementById("matchweek-select");
            select.innerHTML = "";
            
            for (let i = 1; i <= 38; i++) {
                const opt = document.createElement("option");
                opt.value = i;
                opt.textContent = `${i}. Spieltag`;
                opt.className = "bg-slate-900 text-white";
                select.appendChild(opt);
            }
            select.value = 8;
        }

        function switchTab(tabName) {
            const tabs = ['games', 'standings'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tabName) {
                    btn.className = "px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-900/80 text-cyan-300 border-t-2 border-cyan-400 transition shadow-lg";
                    content.classList.remove("hidden");
                } else {
                    btn.className = "px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-950/40 text-slate-400 hover:text-white transition";
                    content.classList.add("hidden");
                }
            });
        }

        async function initDashboard() {
            initMatchweekSelect();
            await refreshAllData();
        }

        async function refreshAllData() {
            const select = document.getElementById("matchweek-select");
            loadPlGames(select.value);
            await loadPlStandings();
        }

        function loadSelectedMatchweek() {
            const select = document.getElementById("matchweek-select");
            currentMatchweek = parseInt(select.value);
            loadPlGames(currentMatchweek);
        }

        function loadPlGames(weekNum) {
            const container = document.getElementById("games-container");
            container.innerHTML = "";

            const matches = MATCHWEEKS_DATA[weekNum];

            if (!matches || matches.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">Für diesen Spieltag stehen aktuell noch keine Ansetzungen fest.</div>';
                return;
            }

                let badgeClass = "bg-blue-950 text-blue-300 border border-blue-800";
                if (match.status === "ENDE") {
                    badgeClass = "bg-emerald-950/80 text-emerald-300 border border-emerald-700/60 font-bold";
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs border-b border-blue-900/50 pb-2.5">
                        <span class="text-blue-400 font-bold">LA LIGA</span>
                        <span class="px-2.5 py-0.5 rounded-full text-[11px] ${badgeClass}">${match.status === 'ENDE' ? 'ENDE (' + match.date + ')' : match.date}</span>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <img src="${homeLogo}" class="w-8 h-8 object-contain filter drop-shadow" alt="Logo">
                                <span class="font-bold text-white text-base">${match.home}</span>
                            </div>
                            <span class="text-2xl font-black ${match.homeScore > match.awayScore ? 'text-cyan-400' : 'text-slate-200'}">
                                ${match.homeScore}
                            </span>
                        </div>

                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <img src="${awayLogo}" class="w-8 h-8 object-contain filter drop-shadow" alt="Logo">
                                <span class="font-bold text-white text-base">${match.away}</span>
                            </div>
                            <span class="text-2xl font-black ${match.awayScore > match.homeScore ? 'text-cyan-400' : 'text-slate-200'}">
                                ${match.awayScore}
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadPlStandings() {
            const url = "https://site.api.espn.com/apis/v2/sports/soccer/esp.1/standings";
            const tbody = document.getElementById("table-body");

            try {
                const response = await fetch(url);
                const data = await response.json();

                const entries = data.children?.[0]?.standings?.entries || data.standings?.entries || [];
                renderTable(entries, tbody);

            } catch (error) {
                console.error("Fehler beim Abrufen der Tabelle:", error);
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-6 text-center text-rose-400">Fehler beim Laden der Tabelle.</td></tr>';
            }
        }

        function renderTable(entries, tbody) {
            tbody.innerHTML = "";

            if (!entries || entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-6 text-center text-slate-500">Keine Tabellendaten gefunden.</td></tr>';
                return;
            }

            entries.forEach((entry, idx) => {
                const team = entry.team;
                const stats = entry.stats || [];

                const getStat = (name) => stats.find(s => s.name === name)?.displayValue || "0";

                const rank = idx + 1;
                const games = getStat("gamesPlayed");
                const wins = getStat("wins");
                const draws = getStat("ties");
                const losses = getStat("losses");
                const points = getStat("points");
                const diff = getStat("pointDifferential");
                const goalsFor = getStat("pointsFor");
                const goalsAgainst = getStat("pointsAgainst");

                let rankStyle = "text-slate-400 border-l-2 border-transparent";
                if (rank <= 4) rankStyle = "text-cyan-400 font-extrabold border-l-4 border-cyan-400 pl-1";
                else if (rank === 5) rankStyle = "text-blue-400 font-bold border-l-4 border-blue-500 pl-1";
                else if (rank >= 18) rankStyle = "text-rose-400 font-bold border-l-4 border-rose-500 pl-1";

                const row = document.createElement("tr");
                row.className = idx % 2 === 0 ? "bg-blue-950/30 hover:bg-blue-900/50 transition" : "bg-blue-950/10 hover:bg-blue-900/50 transition";

                row.innerHTML = `
                    <td class="px-3 py-3 ${rankStyle}">${rank}</td>
                    <td class="px-4 py-3 font-semibold text-white flex items-center gap-3">
                        <img src="${team?.logos?.[0]?.href || ''}" class="w-6 h-6 object-contain" alt="Logo">
                        ${team?.displayName || 'Unbekannt'}
                    </td>
                    <td class="px-3 py-3 text-center text-slate-300">${games}</td>
                    <td class="px-3 py-3 text-center text-slate-300">${wins}</td>
                    <td class="px-3 py-3 text-center text-slate-300">${draws}</td>
                    <td class="px-3 py-3 text-center text-slate-300">${losses}</td>
                    <td class="px-3 py-3 text-center text-slate-400">${goalsFor}:${goalsAgainst}</td>
                    <td class="px-3 py-3 text-center font-medium ${parseInt(diff) > 0 ? 'text-emerald-400' : (parseInt(diff) < 0 ? 'text-rose-400' : 'text-slate-400')}">${diff}</td>
                    <td class="px-4 py-3 text-center font-black text-cyan-300 text-base">${points}</td>
                `;
                tbody.appendChild(row);
            });
        }

        document.addEventListener("DOMContentLoaded", initDashboard);
    </script>
</body>
</html>
